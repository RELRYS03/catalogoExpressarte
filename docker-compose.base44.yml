services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      # Serve the cloned working copy directly: no build step, no copy.
      # Edits in index.html / styles.css / app.js / config.js show on reload.
      - ./:/usr/share/nginx/html:ro
      - ./.base44/nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - BASE44_PREVIEW_MODE
    labels:
      base44.project: "Express'Arte Catálogo"
      base44.kind: web
      base44.port: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/index.html || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
