# Sandbox static-server config for the Express'Arte catalogue.
#
# This is a FULL nginx.conf (mounted at /etc/nginx/nginx.conf), not a
# server-only snippet, for one reason: the checkout is bind-mounted read-only
# and its root directory is mode 700 (root-only), so the default `user nginx`
# worker cannot traverse it and every request fails with "Permission denied".
# Running the worker as root lets it read the mount. Everything else here is
# ordinary static serving: no caching (so a reload shows edits), dotfiles
# (.git, .base44) blocked, gzip on.
user root;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Always revalidate so a reload after an edit shows the current source.
        add_header Cache-Control "no-store" always;

        # Do not serve dotfiles/dot-directories (.git, .base44, .gitignore).
        location ~ /\. {
            deny all;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
